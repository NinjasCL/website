version: '3.17'

dotenv: ['.env']

vars:
  DIST_DIR: dist

tasks:
  default:
    desc: Generate the static blog into ./dist
    deps: [build]

  setup:
    aliases: [s]
    desc: Verify Gleam/Erlang and install dependencies
    silent: true
    preconditions:
      - sh: command -v gleam
        msg: "Gleam is not installed or not on PATH"
      - sh: command -v erl
        msg: "Erlang is not installed or not on PATH"
    cmds:
      - gleam --version
      - erl -noshell -eval 'io:format("Erlang/OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
      - gleam deps download

  build:
    aliases: [b]
    desc: Generate the static blog into ./dist
    cmds:
      - rm -rf dist/
      - gleam run

  optimize:
    aliases: [o]
    desc: Download, optimize, and normalize blog images
    cmds:
      - task -d tools/optimize

  qiita:
    aliases: [q]
    desc: Generate qiita.toml for a post (defaults to the latest Japanese post)
    cmds:
      - gleam run -m qiita -- {{.CLI_ARGS}}

  qiita.publish:
    aliases: [qp]
    desc: Publish a generated qiita.toml (defaults to the latest Japanese post)
    cmds:
      - gleam run -m qiita -- --publish {{.CLI_ARGS}}

  dev:
    aliases: [d]
    desc: Start the dev server at http://127.0.0.1:3000
    cmds:
      - rm -rf dist/
      - gleam run -m ninjas/local

  upload:
    aliases: [u]
    desc: Upload only changed dist/ files to FTP_ROUTE over SFTP
    silent: true
    cmds:
      - task: optimize
      - task: build
      - |
        set -eu

        changes=$(mktemp "${TMPDIR:-/tmp}/ftp-sync-changes.XXXXXX")
        trap 'rm -f "$changes"' EXIT

        # The planner compares MD5 content hashes from website-manifest.json
        # with the freshly built dist/, so rebuilt files with identical bytes
        # are skipped and only real additions, changes, and deletions ship.
        tools/ftp/ftp-sync --dist "{{.DIST_DIR}}" plan > "$changes"
        if [ ! -s "$changes" ]; then
          echo "ftp-sync: no changes to upload"
          exit 0
        fi

        tools/ftp/ftp-upload < "$changes"

        # Advance the hash cache only after a successful upload so failures
        # are retried on the next run.
        tools/ftp/ftp-sync --dist "{{.DIST_DIR}}" commit
