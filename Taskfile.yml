version: '3.17'

dotenv: ['.env']

vars:
  DIST_DIR: dist
  SNAPSHOT_DIR: .ftp-upload-dist

tasks:
  default:
    desc: Generate the static blog into ./dist
    deps: [build]

  setup:
    aliases: [s]
    desc: Verify Gleam/Erlang and install dependencies
    silent: true
    preconditions:
      - sh: command -v gleam
        msg: "Gleam is not installed or not on PATH"
      - sh: command -v erl
        msg: "Erlang is not installed or not on PATH"
    cmds:
      - gleam --version
      - erl -noshell -eval 'io:format("Erlang/OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
      - gleam deps download

  build:
    aliases: [b]
    desc: Generate the static blog into ./dist
    cmds:
      - rm -rf dist/
      - gleam run

  dev:
    aliases: [d]
    desc: Start the dev server at http://127.0.0.1:3000
    cmds:
      - rm -rf dist/
      - gleam run -m ninjas/local

  upload:
    aliases: [u]
    desc: Upload only changed dist/ files to FTP_ROUTE over SFTP
    silent: true
    deps: [build]
    cmds:
      - mkdir -p {{.SNAPSHOT_DIR}}
      - |
        set -eu

        changes=$(mktemp "${TMPDIR:-/tmp}/ftp-upload-changes.XXXXXX")
        trap 'rm -f "$changes"' EXIT

        # git diff --no-index compares the last uploaded snapshot with the
        # freshly built dist/ (which is git-ignored). Exit 1 just means
        # "differences found".
        git diff --no-index --name-status --no-renames \
          -- "{{.SNAPSHOT_DIR}}" "{{.DIST_DIR}}" > "$changes" || test $? -eq 1

        # Both sides of the diff carry their directory prefix; strip it so the
        # tool receives plain paths relative to dist/.
        awk -v snapshot="{{.SNAPSHOT_DIR}}" -v dist="{{.DIST_DIR}}" '
          BEGIN { FS = "\t" }
          {
            status = $1
            path = $2

            if (index(path, snapshot "/") == 1)
              path = substr(path, length(snapshot) + 2)
            else if (index(path, dist "/") == 1)
              path = substr(path, length(dist) + 2)

            if (path ~ /(^|\/)\.DS_Store$/) next

            print status "\t" path
          }
        ' "$changes" | tools/ftp-upload

        # Only advance the snapshot after a successful upload so failures are
        # retried on the next run.
        if command -v rsync >/dev/null 2>&1; then
          rsync -a --delete "{{.DIST_DIR}}/" "{{.SNAPSHOT_DIR}}/"
        else
          rm -rf "{{.SNAPSHOT_DIR}}"
          cp -R "{{.DIST_DIR}}" "{{.SNAPSHOT_DIR}}"
        fi
